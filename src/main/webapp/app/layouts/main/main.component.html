<jhi-page-ribbon />

<!-- Loader globale: appare su ogni chiamata HTTP -->
<rh-loader />

@if (showNavbar()) {
  <div>
    <router-outlet name="navbar" />
  </div>
}

<div class="rh-main-wrapper">
  <div class="card jh-card">
    <div [@routeAnimations]="getRouteAnimationData(outlet)" style="position: relative">
      <router-outlet #outlet="outlet" />
    </div>
  </div>
</div>

@if (showFooter()) {
  <jhi-footer />
}

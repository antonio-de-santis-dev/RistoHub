<jhi-page-ribbon />

@if (showNavbar()) {
  <div>
    <router-outlet name="navbar" />
  </div>
}

<div class="rh-main-wrapper">
  <div class="card jh-card">
    <div [@routeAnimations]="getRouteAnimationData(outlet)" style="position: relative; min-height: calc(100vh - 52px)">
      <router-outlet #outlet="outlet" />
    </div>
  </div>
</div>

<!--
  Footer SEMPRE nel DOM — mai rimosso con @if.
  La classe "rh-footer-hidden" lo rende invisibile e senza altezza,
  così non causa mai reflow o "salti" durante la navigazione o il loader.
-->
<jhi-footer [class.rh-footer-hidden]="!showFooter()" />

<!-- Loader globale: appendito al <body> via JS -->
<rh-loader />

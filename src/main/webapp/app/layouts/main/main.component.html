<jhi-page-ribbon />

@if (showNavbar()) {
  <div>
    <router-outlet name="navbar" />
  </div>
}

<div class="rh-main-wrapper">
  <div class="card jh-card">
    <div [@routeAnimations]="getRouteAnimationData(outlet)" style="position: relative">
      <router-outlet #outlet="outlet" />
    </div>
  </div>
</div>

@if (showFooter()) {
  <jhi-footer />
}

<!-- Loader globale: appendito al <body> via JS per evitare problemi di
     stacking context con i componenti landing/login (position:fixed z-900) -->
<rh-loader />

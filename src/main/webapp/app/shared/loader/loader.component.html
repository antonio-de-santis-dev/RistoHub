<div class="rh-loader-overlay" *ngIf="loading$ | async">
  <div class="rh-loader-box">
    <!-- Logo -->
    <img src="/content/images/LogoBianco.png" alt="RistoHub" class="rh-logo" />

    <!-- Posate + Piatto in flex row -->
    <div class="rh-cutlery-row">
      <!-- FORCHETTA — fissa a sinistra, non animata -->
      <svg class="rh-cutlery rh-fork" viewBox="0 0 40 120" xmlns="http://www.w3.org/2000/svg">
        <line x1="8" y1="8" x2="8" y2="52" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <line x1="20" y1="4" x2="20" y2="52" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <line x1="32" y1="8" x2="32" y2="52" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <path d="M8 52 Q20 62 32 52" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <line x1="20" y1="62" x2="20" y2="116" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      </svg>

      <!-- PIATTO — solo gli anelli animati, nessuna posata dentro -->
      <div class="rh-plate-wrap">
        <svg class="rh-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <!-- Anello esterno oro — ruota -->
          <circle
            class="plate-outer"
            cx="80"
            cy="80"
            r="68"
            fill="none"
            stroke="#FFD200"
            stroke-width="8"
            stroke-dasharray="360"
            stroke-dashoffset="90"
            stroke-linecap="round"
          />
          <!-- Anello interno turchese — ruota al contrario -->
          <circle
            class="plate-inner"
            cx="80"
            cy="80"
            r="46"
            fill="none"
            stroke="#3DD6C8"
            stroke-width="8"
            stroke-dasharray="240"
            stroke-dashoffset="60"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <!-- COLTELLO — fisso a destra, non animato -->
      <svg class="rh-cutlery rh-knife" viewBox="0 0 40 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 8 Q32 10 32 44 L20 52" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="20" y1="8" x2="20" y2="116" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Testo -->
    <div class="rh-loading-text">Caricamento</div>

    <!-- Puntini -->
    <div class="rh-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>

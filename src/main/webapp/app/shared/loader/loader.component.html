<div class="rh-loader-overlay" *ngIf="loading$ | async">
  <div class="rh-loader-box">
    <div class="rh-loader-icon">
      <!-- Logo RistoHub -->
      <img src="/content/images/LogoBianco.png" alt="RistoHub" class="rh-logo" />

      <!-- SVG: piatto oro + turchese, posate bianco brillante -->
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="rh-svg">
        <!-- Piatto esterno: oro caldo -->
        <circle class="plate-outer" cx="100" cy="105" r="62" fill="none" stroke="#FFD200" stroke-width="8" stroke-linecap="round" />

        <!-- Piatto interno: turchese brillante -->
        <circle class="plate-inner" cx="100" cy="105" r="40" fill="none" stroke="#3DD6C8" stroke-width="8" stroke-linecap="round" />

        <!-- Forchetta: bianco puro con ombra -->
        <g class="fork" transform="translate(52, 38)">
          <path
            d="M14 75 L14 130 Q14 136 20 136 Q26 136 26 130 L26 75"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M14 75 Q20 82 26 75" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
          <line x1="10" y1="40" x2="10" y2="72" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
          <line x1="20" y1="36" x2="20" y2="72" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
          <line x1="30" y1="40" x2="30" y2="72" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
        </g>

        <!-- Coltello: bianco puro -->
        <g class="knife" transform="translate(122, 38)">
          <path
            d="M13 80 L13 130 Q13 136 19 136 Q25 136 25 130 L25 80"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M13 80 L13 42 Q13 36 22 36 Q28 40 25 80"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>

      <!-- Testo -->
      <div class="rh-loading-text">Caricamento</div>

      <!-- Puntini oro -->
      <div class="rh-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</div>

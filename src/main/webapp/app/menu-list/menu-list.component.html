<div class="menu-list-container">
  <h2>I miei Menu</h2>

  @if (menus.length > 0) {
    <div class="menu-grid">
      @for (menu of menus; track menu.id) {
        <div class="menu-card" [routerLink]="['/menu', menu.id]">
          <div class="menu-card-bar" [style.background]="menu.colorePrimario ?? '#c8102e'"></div>
          <div class="menu-card-content">
            <h3>{{ menu.nome }}</h3>
            @if (menu.descrizione) {
              <p>{{ menu.descrizione }}</p>
            }
            <div class="menu-card-meta">
              <span class="menu-template-badge">{{ templateLabel(menu.templateStyle) }}</span>
              <span class="menu-font" [style.font-family]="menu.fontMenu ?? 'Playfair Display'">Aa</span>
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <p class="no-menus">Nessun menu trovato. <a routerLink="/menu/new">Crea un nuovo menu</a></p>
  }
</div>

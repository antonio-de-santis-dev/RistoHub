<!-- PAGINA LANDING FULL SCREEN -->
<div class="page-wrap" [class.split-active]="showLogin">
  <!-- ── Sfondo food + card logo ─────────────────────────────── -->
  <div class="left-half">
    <div class="logo-card" [class.card-shrink]="showLogin">
      <!-- LOGO (rimane sempre) -->
      <img
        src="content/images/LogoNero.png"
        alt="RistoHub"
        class="logo-img"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
      />
      <div class="logo-fallback" style="display: none">
        <span>🍽️</span>
        <span class="logo-fallback-nome">RistoHub</span>
      </div>

      <!-- Separatore + testo + btn (spariscono durante animazione) -->
      <div class="card-right" [class.card-right-out]="showLogin">
        <div class="card-divider"></div>
        <div class="card-text-wrap">
          <h1 class="headline">
            Scegli il tuo<br />
            mood, noi ci<br />
            mettiamo il gusto
          </h1>
          <button class="btn-start" (click)="mostraLogin()">
            <span>Get started</span>
            <span class="btn-icon">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
